name: Experimental macOS build

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      LAST_FM_API_KEY:
        required: false
      LAST_FM_API_SECRET:
        required: false
    inputs:
      build_timestamp:
        description: UTC timestamp shared by all release packages
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Set build timestamp
        id: timestamp
        env:
          RELEASE_TIMESTAMP: ${{ inputs.build_timestamp }}
        run: |
          stamp="${RELEASE_TIMESTAMP:-$(date -u +%Y-%m-%d_%H-%M-%S-UTC)}"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
      - name: Install GTK and GStreamer with Homebrew
        if: matrix.arch == 'arm64'
        run: |
          brew install pygobject3 gtk+3 gstreamer glib-networking adwaita-icon-theme librsvg
          echo "$(brew --prefix python@3.14)/bin" >> "$GITHUB_PATH"
      - name: Set up MacPorts
        if: matrix.arch == 'x86_64'
        uses: melusina-org/setup-macports@v1
        with:
          parameters: .github/macos-intel-ports.yml
      - name: Install GTK and GStreamer with MacPorts
        if: matrix.arch == 'x86_64'
        run: |
          sudo port -N install python314 py314-gobject3 gtk3 adwaita-icon-theme librsvg glib-networking gstreamer1-gst-plugins-base gstreamer1-gst-plugins-good gstreamer1-gst-plugins-bad gstreamer1-gst-plugins-ugly
          echo /opt/local/bin >> "$GITHUB_PATH"
      - name: Install Python build dependencies
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          python3.14 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyinstaller keyring psutil mutagen
          .venv/bin/python -c 'import gi, cairo, keyring.backends.macOS, psutil, mutagen; gi.require_version("Gtk", "3.0"); gi.require_version("Gst", "1.0"); from gi.repository import Gtk, Gst'
      - name: Test application code
        run: |
          .venv/bin/python player.py --self-test
          .venv/bin/python -m unittest discover -q
      - name: Prepare macOS icon
        run: |
          mkdir -p macos/Apistat.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" apistat.png --out "macos/Apistat.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" apistat.png --out "macos/Apistat.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns macos/Apistat.iconset -o macos/Apistat.icns
      - name: Configure Last.fm application credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LAST_FM_API_SECRET }}
        run: .venv/bin/python scripts/embed_lastfm_credentials.py --require
      - name: Build and check app bundle
        run: |
          .venv/bin/pyinstaller --noconfirm --clean macos/Apistat.spec
          test -f dist/Apistat.app/Contents/MacOS/Apistat
          lipo dist/Apistat.app/Contents/MacOS/Apistat -verify_arch '${{ matrix.arch }}'
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' dist/Apistat.app/Contents/Info.plist)" = '15.0'
          find dist/Apistat.app -iname '*soup*' -print
          codesign --verify --deep --strict --verbose=4 dist/Apistat.app
          find dist/Apistat.app -type f -exec shasum -a 256 {} + | sort > "$RUNNER_TEMP/apistat-before.txt"
          APISTAT_REQUIRE_LASTFM_BUILD=1 GST_DEBUG=2 dist/Apistat.app/Contents/MacOS/Apistat --self-test --playback-test-dir test_fixtures/audio
          find dist/Apistat.app -type f -exec shasum -a 256 {} + | sort > "$RUNNER_TEMP/apistat-after.txt"
          if ! codesign --verify --deep --strict --verbose=4 dist/Apistat.app; then
            diff -u "$RUNNER_TEMP/apistat-before.txt" "$RUNNER_TEMP/apistat-after.txt" || true
            exit 1
          fi
      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/Apistat.app Apistat-macOS-${{ matrix.arch }}-${{ steps.timestamp.outputs.stamp }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Apistat-macOS-${{ matrix.arch }}-${{ steps.timestamp.outputs.stamp }}
          path: Apistat-macOS-${{ matrix.arch }}-${{ steps.timestamp.outputs.stamp }}.zip
          if-no-files-found: error
