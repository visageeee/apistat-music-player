name: Build packages and draft release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Configure Last.fm application credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LAST_FM_API_SECRET }}
        run: python3 scripts/embed_lastfm_credentials.py --require
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: org.apistat.Apistat.json
          bundle: Apistat.flatpak
          branch: stable
          upload-artifact: false
      - name: Check packaged runtime
        run: |
          dbus-run-session -- flatpak build --runtime --env=APISTAT_REQUIRE_LASTFM_BUILD=1 flatpak_app /app/bin/apistat --self-test
          dbus-run-session -- flatpak build --runtime flatpak_app python3 -c 'import mutagen, gi; gi.require_version("Secret", "1"); gi.require_version("Gst", "1.0"); from gi.repository import Secret, Gst; Gst.init(None); missing = [name for name in ("flacdec", "mpg123audiodec") if not Gst.ElementFactory.find(name)]; assert not missing, "Missing decoders: " + ", ".join(missing)'
          flatpak build --runtime flatpak_app python3 -c 'from pathlib import Path; import cairo; assert Path("/app/share/apistat/fonts/Nunito-wght.ttf").is_file(); assert cairo.ImageSurface.create_from_png("/app/share/apistat/apistat.png").get_width() > 0'
      - uses: actions/upload-artifact@v4
        with:
          name: Apistat-Flatpak-x86_64
          path: Apistat.flatpak
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-psutil
            mingw-w64-ucrt-x86_64-python-mutagen
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-gst-python
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
      - name: Validate source
        run: |
          python -m compileall -q .
          python player.py --self-test
          python -m unittest discover -q
      - name: Configure Last.fm application credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LAST_FM_API_SECRET }}
        run: python scripts/embed_lastfm_credentials.py --require
      - name: Build portable app
        run: |
          pyinstaller --noconfirm --clean windows/Apistat.spec
          test -f dist/Apistat/Apistat.exe
          test ! -e dist/Apistat/Apistat-Debug.exe
      - name: Check frozen runtime
        shell: pwsh
        run: |
          $env:APISTAT_REQUIRE_LASTFM_BUILD = '1'
          $env:APISTAT_SELF_TEST_REPORT = Join-Path $env:RUNNER_TEMP 'apistat-self-test.txt'
          $process = Start-Process -FilePath (Resolve-Path dist/Apistat/Apistat.exe) -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id -Force; throw 'Apistat self-test timed out' }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:APISTAT_SELF_TEST_REPORT) { Get-Content $env:APISTAT_SELF_TEST_REPORT }
            throw "Apistat self-test failed with exit code $($process.ExitCode)"
          }
      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path dist/Apistat -DestinationPath Apistat-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Apistat-Windows-x64
          path: Apistat-Windows-x64.zip
          if-no-files-found: error

  draft:
    name: Prepare draft release
    needs: [flatpak, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Apistat-*
          path: release-assets
          merge-multiple: true
      - name: Create draft with both packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s release-assets/Apistat.flatpak
          test -s release-assets/Apistat-Windows-x64.zip
          tag="draft-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" release-assets/Apistat.flatpak release-assets/Apistat-Windows-x64.zip \
            --draft --target "$GITHUB_SHA" --title "Apistat development build $tag" \
            --notes "Development build from commit $GITHUB_SHA. Packages are unsigned; test them before publishing."
