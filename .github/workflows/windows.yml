name: Windows build

on:
  push:
    paths:
      - '**.py'
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - '**.py'
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-psutil
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-gst-python
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav
      - name: Validate Windows dependencies and source
        run: |
          python -m compileall -q .
          python player.py --self-test
          python -m unittest discover -q
          find /ucrt64/lib/gstreamer-1.0 -iname '*whisper*' -o -iname '*transcrib*'
      - name: Build portable app
        run: |
          pyinstaller --noconfirm --clean windows/Apistat.spec
          test -f dist/Apistat/Apistat.exe
          find dist/Apistat -iname '*ggml*' -o -iname '*whisper*'
      - name: Check frozen runtime
        run: ./dist/Apistat/Apistat-Debug.exe --self-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Apistat-Windows-x64
          path: dist/Apistat/
          if-no-files-found: error
